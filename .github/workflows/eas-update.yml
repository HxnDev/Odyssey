name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel to publish to"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN secret is not set. Create an Expo access token and add it to the repo secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: eas update --channel ${{ github.event.inputs.channel || 'preview' }} --auto --non-interactive
